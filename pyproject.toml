[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lux-frontier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "optiland==0.6.3", "numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lux-cooke-smoke = "lux_frontier.cooke_smoke:main"

[tool.setuptools.packages.find]
include = ["lux_frontier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
